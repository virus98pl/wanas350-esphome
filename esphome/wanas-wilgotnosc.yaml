# =====================================================================
#  Czujnik wilgotności i temperatury w skrzynce rozprężnej wyciągów
#  NodeMCU v3 (ESP8266, CH340) + SHT3x (SHT30/SHT31, I2C)
#  Obudowy do druku: stl/ (korpus + pokrywka czujnika, pudełko NodeMCU)
#
#  Połączenie (4 przewody dupont, możliwie krótko – do ~1 m):
#    SHT3x VIN/VCC -> 3V3          SHT3x GND -> GND
#    SHT3x SDA     -> D2 (GPIO4)   SHT3x SCL -> D1 (GPIO5)
#  Zasilanie: zasilacz 5 V przez micro-USB.
#  Pierwsze wgranie przez USB (sterownik CH340), kolejne przez Wi-Fi (OTA).
#  Secrets: te same co dla wanas350 (wifi_ssid, wifi_password, ap_password,
#  api_key, ota_password) – patrz secrets.example.yaml.
#
#  Encje w HA (urządzenie „Rekuperator wyciąg”):
#    sensor.rekuperator_wyciag_temperatura
#    sensor.rekuperator_wyciag_wilgotnosc          <- używa pakiet rekuperator_wilgotnosc.yaml
#    sensor.rekuperator_wyciag_punkt_rosy          <- j.w. (zapas nad punktem rosy)
#    sensor.rekuperator_wyciag_wilgotnosc_bezwzgledna
#  Nazw „Wilgotność” i „Punkt rosy” nie zmieniaj, bo pakiet przestanie działać.
# =====================================================================

substitutions:
  name: wanas-wilgotnosc
  friendly: "Rekuperator wyciąg"

esphome:
  name: ${name}
  friendly_name: ${friendly}

esp8266:
  board: nodemcuv2

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-awaryjny"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

i2c:
  sda: GPIO4        # D2
  scl: GPIO5        # D1
  scan: true
  frequency: 50kHz  # wolniej = pewniej na dłuższym przewodzie

sensor:
  - platform: sht3xd
    address: 0x44   # 0x45, gdy pin ADR podłączony do VCC
    update_interval: 10s
    temperature:
      name: "Temperatura"
      id: t_wyc
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average: { window_size: 6, send_every: 3 }
    humidity:
      name: "Wilgotność"
      id: rh_wyc
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average: { window_size: 6, send_every: 3 }

  # punkt rosy (wzór Magnusa)
  - platform: template
    name: "Punkt rosy"
    id: dew_wyc
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      const float t = id(t_wyc).state, rh = id(rh_wyc).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      const float a = 17.62f, b = 243.12f;
      const float g = logf(rh / 100.0f) + a * t / (b + t);
      return b * g / (a - g);

  # wilgotność bezwzględna [g/m³]
  - platform: template
    name: "Wilgotność bezwzględna"
    unit_of_measurement: "g/m³"
    state_class: measurement
    icon: mdi:water
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      const float t = id(t_wyc).state, rh = id(rh_wyc).state;
      if (std::isnan(t) || std::isnan(rh)) return NAN;
      return 6.112f * expf(17.67f * t / (t + 243.5f)) * rh * 2.1674f / (273.15f + t);

  - { platform: wifi_signal, name: "Wi-Fi sygnał", entity_category: diagnostic, update_interval: 60s }
  - { platform: uptime, type: timestamp, name: "Uruchomiony", entity_category: diagnostic }

text_sensor:
  - platform: wifi_info
    bssid:
      name: "Wi-Fi BSSID"
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Restart"
    entity_category: config
