# =====================================================================
#  WANAS 350 V/2 (2019) – sterownik KinCony KC868-A4, WERSJA PODSTAWOWA
#  Wentylatory 0-10 V + tacho, wbudowana nagrzewnica wstępna 500 W
#  (przekaźnik K1, włącz/wyłącz jak w oryginale), 5x DS18B20,
#  bypass 3-punktowy 230 V. Tabliczka: WANAS 350 V/2, 2019.
#
#  Wiązka WANAS:  "10V" = wejście 0-10 V wentylatora  -> DAC1 / DAC2
#                 "SIG" = tacho wentylatora           -> DI1 / DI2
#                 "GND"                               -> GND
#  NIGDY nie podawaj napięcia na "SIG".
#
#  1. Uzupełnij secrets.yaml (wifi_ssid, wifi_password, ap_password, api_key, ota_password)
#     – wzór w secrets.example.yaml.
#  2. Obok tego pliku musi leżeć wanas350_czas.h (w HA: /config/esphome/).
#  3. Adresy DS18B20 niżej są z mojego egzemplarza – wpisz swoje
#     (odczytasz je w logach ESPHome po pierwszym starcie).
#  4. Sprawdź miernikiem, czy DAC1 = nawiew (inaczej zamień GPIO25/26).
# =====================================================================

substitutions:
  name: wanas350
  friendly: "Rekuperator"
  addr_t_zew: "0xe40417c2dd7eff28"   # kanał czerpni PRZED nagrzewnicą
  addr_t_cze: "0xb3000000d6796b28"   # wlot centrali (WANAS: ZEWNĘTRZNA)
  addr_t_naw: "0x7f000000d488e628"   # nawiew za wymiennikiem
  addr_t_wyc: "0x1a000000d5a86d28"   # powietrze z domu (WANAS: POMIESZCZENIA)
  addr_t_wyr: "0x3d000000d535e428"   # wyrzut za wymiennikiem
  pin_dac_naw: GPIO25
  pin_dac_wyw: GPIO26

esphome:
  includes:
    - wanas350_czas.h   # sek_od_startu(): bez przewijania co 49,7 dnia
  name: ${name}
  friendly_name: ${friendly}
  on_boot:
    - priority: 600
      then:
        - output.set_level: { id: dac_naw, level: 0 }
        - output.set_level: { id: dac_wyw, level: 0 }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-awaryjny"
    password: !secret ap_password   # 16.11.2026: awaryjna sieć nie jest już otwarta (hasło w secrets.yaml)

captive_portal:

api:
  id: api_server
  encryption:
    key: !secret api_key
  reboot_timeout: 0s          # brak HA nie restartuje sterownika
  homeassistant_states: true  # 16.11.2026: odczyt temperatury domu z HA (bypass)

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

debug:            # 16.11.2026: potrzebne do czujnika „Przyczyna restartu”

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw

globals:
  - { id: out_naw, type: float, initial_value: "0" }
  - { id: out_wyw, type: float, initial_value: "0" }
  - { id: kominek_until, type: uint32_t, initial_value: "0" }
  - { id: wietrz_until, type: uint32_t, initial_value: "0" }
  - { id: ha_last_seen, type: uint32_t, initial_value: "0" }
  - { id: filter_sec, type: uint32_t, restore_value: true, initial_value: "0" }
  - { id: bypass_open, type: bool, restore_value: true, initial_value: "false" }
  - { id: heat_on, type: bool, initial_value: "false" }
  - { id: heat_changed, type: uint32_t, initial_value: "0" }
  - { id: frost_since, type: uint32_t, initial_value: "0" }
  - { id: frost_factor, type: float, initial_value: "1" }
  - { id: fan_naw_bad_since, type: uint32_t, initial_value: "0" }
  - { id: fan_wyw_bad_since, type: uint32_t, initial_value: "0" }

one_wire:
  - platform: gpio
    pin: GPIO13
    id: ow_bus

# ---------------------------------------------------------------------
#  WYJŚCIA
# ---------------------------------------------------------------------
output:
  - platform: esp32_dac            # DAC1 -> "10V" wentylatora NAWIEWNEGO
    pin: ${pin_dac_naw}
    id: dac_naw
  - platform: esp32_dac            # DAC2 -> "10V" wentylatora WYWIEWNEGO
    pin: ${pin_dac_wyw}
    id: dac_wyw

switch:
  - platform: gpio                 # K1 -> L nagrzewnicy wstępnej 500 W (zacisk WANAS N_PIERWOTNA)
    pin: GPIO2
    id: k1_heat
    name: "Nagrzewnica wstępna (K1)"
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
  - platform: gpio                 # K2 -> rezerwa
    pin: GPIO15
    id: k2
    name: "K2 rezerwa"
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
  - platform: gpio                 # K3 -> bypass (ON = otwórz, OFF = zamknij)
    pin: GPIO5
    id: k3_bypass
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio                 # K4 -> rezerwa
    pin: GPIO4
    id: k4
    name: "K4 rezerwa"
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
  - platform: gpio
    pin: GPIO18
    id: buzzer
    restore_mode: ALWAYS_OFF
    internal: true
  - { platform: template, id: cfg_preheater, name: "Jest nagrzewnica wstępna", optimistic: true, restore_mode: RESTORE_DEFAULT_ON, entity_category: config }
  - { platform: template, id: cfg_tacho, name: "Kontrola obrotów (tacho)", optimistic: true, restore_mode: RESTORE_DEFAULT_ON, entity_category: config }
  - platform: template
    id: test_mode
    name: "Tryb testowy (ręczne sterowanie)"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

# ---------------------------------------------------------------------
#  NASTAWY
# ---------------------------------------------------------------------
number:
  - { platform: template, id: n_b1, name: "Bieg 1 [%]", min_value: 5, max_value: 100, step: 1, initial_value: 25, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_b2, name: "Bieg 2 [%]", min_value: 5, max_value: 100, step: 1, initial_value: 45, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_b3, name: "Bieg 3 [%]", min_value: 5, max_value: 100, step: 1, initial_value: 65, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_b4, name: "Bieg 4 [%]", min_value: 5, max_value: 100, step: 1, initial_value: 90, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_bal, name: "Balans wywiew względem nawiewu [pkt %]", min_value: -20, max_value: 20, step: 1, initial_value: 0, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, id: n_min_run, name: "Minimalne wysterowanie [%]", min_value: 3, max_value: 40, step: 1, initial_value: 15, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_noc_max, name: "Tryb nocny – maks. [%]", min_value: 5, max_value: 100, step: 1, initial_value: 35, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_urlop, name: "Tryb urlop [%]", min_value: 5, max_value: 50, step: 1, initial_value: 18, optimistic: true, restore_value: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_kom_delta, name: "Kominek – nadciśnienie [pkt %]", min_value: 5, max_value: 40, step: 1, initial_value: 20, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, id: n_kom_min, name: "Kominek – czas [min]", min_value: 1, max_value: 30, step: 1, initial_value: 8, optimistic: true, restore_value: true, unit_of_measurement: "min", entity_category: config }
  - { platform: template, id: n_wietrz_min, name: "Przewietrzanie – czas [min]", min_value: 5, max_value: 240, step: 5, initial_value: 30, optimistic: true, restore_value: true, unit_of_measurement: "min", entity_category: config }
  - { platform: template, id: n_t_kom, name: "Temperatura komfortu [°C]", min_value: 18, max_value: 27, step: 0.5, initial_value: 22.5, optimistic: true, restore_value: true, unit_of_measurement: "°C", entity_category: config }
  - { platform: template, id: n_byp_min, name: "Bypass – min. temp. czerpni [°C]", min_value: 5, max_value: 20, step: 0.5, initial_value: 12, optimistic: true, restore_value: true, unit_of_measurement: "°C", entity_category: config }
  - { platform: template, id: n_frost_sp, name: "Odmrażanie – min. T wyrzutu [°C]", min_value: -3, max_value: 5, step: 0.5, initial_value: 1.5, optimistic: true, restore_value: true, unit_of_measurement: "°C", entity_category: config }
  - { platform: template, id: n_pre_tmax, name: "Nagrzewnica – blokada powyżej T_ZEW [°C]", min_value: -5, max_value: 10, step: 0.5, initial_value: 3, optimistic: true, restore_value: true, unit_of_measurement: "°C", entity_category: config }
  - { platform: template, id: n_filtr_dni, name: "Wymiana filtrów co [dni pracy]", min_value: 30, max_value: 365, step: 5, initial_value: 180, optimistic: true, restore_value: true, unit_of_measurement: "d", entity_category: config }
  # --- tryb testowy: ręczne wysterowanie (tylko gdy "Tryb testowy" = ON) ---
  - { platform: template, id: n_test_naw, name: "TEST nawiew [%]", min_value: 0, max_value: 100, step: 1, initial_value: 0, optimistic: true, unit_of_measurement: "%", entity_category: config }
  - { platform: template, id: n_test_wyw, name: "TEST wywiew [%]", min_value: 0, max_value: 100, step: 1, initial_value: 0, optimistic: true, unit_of_measurement: "%", entity_category: config }

select:
  - platform: template
    id: tryb
    name: "Tryb pracy"
    optimistic: true
    restore_value: true
    initial_option: "Bieg 2"
    options: ["Bieg 1", "Bieg 2", "Bieg 3", "Bieg 4", "Nocny", "Urlop", "Wyłączony"]
  - platform: template
    id: byp_mode
    name: "Bypass – tryb"
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options: ["Auto", "Otwarty", "Zamknięty"]

button:
  - platform: template
    name: "Kominek"
    icon: mdi:fireplace
    on_press:
      - lambda: id(kominek_until) = sek_od_startu() + (uint32_t)(id(n_kom_min).state * 60);
  - platform: template
    name: "Przewietrzanie"
    icon: mdi:weather-windy
    on_press:
      - lambda: id(wietrz_until) = sek_od_startu() + (uint32_t)(id(n_wietrz_min).state * 60);
  - platform: template
    name: "Zakończ tryb czasowy"
    on_press:
      - lambda: id(kominek_until) = 0; id(wietrz_until) = 0;
  - platform: template
    name: "Reset licznika filtrów"
    entity_category: config
    on_press:
      - lambda: id(filter_sec) = 0;
  - platform: restart
    name: "Restart sterownika"
    entity_category: diagnostic

# ---------------------------------------------------------------------
#  CZUJNIKI
# ---------------------------------------------------------------------
sensor:
  # ---------- pozostały czas trybów czasowych ----------
  - platform: template
    id: s_wietrz_left
    name: "Przewietrzanie – pozostało [min]"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const uint32_t now = sek_od_startu();
      return now < id(wietrz_until) ? (float)((id(wietrz_until) - now + 59) / 60) : 0.0f;
  - platform: template
    id: s_kominek_left
    name: "Kominek – pozostało [min]"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const uint32_t now = sek_od_startu();
      return now < id(kominek_until) ? (float)((id(kominek_until) - now + 59) / 60) : 0.0f;
  # 16.11.2026: filtry – odrzucany błędny odczyt (brak danych, 85 °C po zaniku zasilania czujnika,
  # wartości spoza −40…70 °C); sterownik trzyma ostatnią dobrą wartość do 60 s, dopiero potem „brak”.
  - { platform: dallas_temp, one_wire_id: ow_bus, address: "${addr_t_zew}", id: t_zew, name: "T zewnętrzna (przed nagrzewnicą)", update_interval: 10s, filters: [ { lambda: "if (std::isnan(x) || x < -40.0f || x > 70.0f) return {}; return x;" }, { timeout: 60s }, { offset: -4.3 } ] }  # korekta czujnika (mierzył ~4,3 °C za dużo)
  - { platform: dallas_temp, one_wire_id: ow_bus, address: "${addr_t_cze}", id: t_cze, name: "T czerpnia (wlot centrali)", update_interval: 10s, filters: [ { lambda: "if (std::isnan(x) || x < -40.0f || x > 70.0f) return {}; return x;" }, { timeout: 60s } ] }
  - { platform: dallas_temp, one_wire_id: ow_bus, address: "${addr_t_naw}", id: t_naw, name: "T nawiew", update_interval: 10s, filters: [ { lambda: "if (std::isnan(x) || x < -40.0f || x > 70.0f) return {}; return x;" }, { timeout: 60s } ] }
  - { platform: dallas_temp, one_wire_id: ow_bus, address: "${addr_t_wyc}", id: t_wyc, name: "T wyciąg (dom)", update_interval: 10s, filters: [ { lambda: "if (std::isnan(x) || x < -40.0f || x > 70.0f) return {}; return x;" }, { timeout: 60s } ] }
  - { platform: dallas_temp, one_wire_id: ow_bus, address: "${addr_t_wyr}", id: t_wyr, name: "T wyrzut", update_interval: 10s, filters: [ { lambda: "if (std::isnan(x) || x < -40.0f || x > 70.0f) return {}; return x;" }, { timeout: 60s } ] }

  # tacho: zacisk WANAS "SIG" (1 imp/obr wg dokumentacji – sprawdź przy uruchomieniu)
  - platform: pulse_counter
    pin: { number: GPIO36, mode: INPUT }
    id: rpm_naw                    # surowy odczyt co 5 s – tylko do logiki (bez nazwy = nie idzie do HA)
    unit_of_measurement: "obr/min"
    update_interval: 5s
    internal_filter: 13us
  - platform: pulse_counter
    pin: { number: GPIO39, mode: INPUT }
    id: rpm_wyw
    unit_of_measurement: "obr/min"
    update_interval: 5s
    internal_filter: 13us
  # 16.11.2026: do HA idzie średnia z 30 s zaokrąglona do 10 obr/min (te same nazwy encji co dotąd)
  - platform: copy
    source_id: rpm_naw
    name: "Obroty nawiew"
    unit_of_measurement: "obr/min"
    accuracy_decimals: 0
    filters:
      - throttle_average: 30s
      - lambda: return roundf(x / 10.0f) * 10.0f;
  - platform: copy
    source_id: rpm_wyw
    name: "Obroty wywiew"
    unit_of_measurement: "obr/min"
    accuracy_decimals: 0
    filters:
      - throttle_average: 30s
      - lambda: return roundf(x / 10.0f) * 10.0f;

  - platform: template
    name: "Wysterowanie nawiew"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(out_naw);
  - platform: template
    name: "Wysterowanie wywiew"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(out_wyw);
  - platform: template
    name: "Sprawność odzysku"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float a = id(t_cze).state, b = id(t_naw).state, c = id(t_wyc).state;
      if (std::isnan(a) || std::isnan(b) || std::isnan(c) || fabsf(c - a) < 5.0f || id(bypass_open)) return NAN;
      return std::max(0.0f, std::min(100.0f, (b - a) / (c - a) * 100.0f));
  - platform: template
    name: "Filtry – dni pracy"
    unit_of_measurement: "d"
    accuracy_decimals: 0
    update_interval: 300s
    lambda: return id(filter_sec) / 86400.0f;
  - { platform: wifi_signal, name: "Wi-Fi sygnał", entity_category: diagnostic, update_interval: 60s }
  # 16.11.2026: chwila startu sterownika (zmienia się tylko po restarcie – widać, kiedy się restartował)
  - { platform: uptime, type: timestamp, name: "Uruchomiony", entity_category: diagnostic }
  # 16.11.2026: temperatura w domu z HA – do decyzji o bypassie (kanały na strychu
  # zaniżają/zawyżają T wyciągu przy centrali). Bez HA sterownik liczy jak dawniej z T wyciągu.
  # ZMIEŃ entity_id na swój czujnik temperatury w domu (np. średnia z pokoi). Jeśli go nie masz,
  # zostaw – encja będzie niedostępna, a bypass liczy wtedy z T wyciągu.
  - { platform: homeassistant, id: t_dom, entity_id: sensor.temperatura_pietro_srednia }

binary_sensor:
  - platform: gpio                 # DI3 -> rezerwa
    pin: { number: GPIO27, inverted: true }
    id: di3
    name: "DI3 rezerwa"
    disabled_by_default: true
  - platform: gpio                 # DI4 <- przycisk KOMINEK
    pin: { number: GPIO14, inverted: true }
    id: btn_kominek
    name: "Przycisk kominek"
    filters: [ delayed_on: 50ms ]
    on_press:
      - lambda: id(kominek_until) = sek_od_startu() + (uint32_t)(id(n_kom_min).state * 60);
  - platform: template
    id: alarm_any
    name: "Alarm"
    device_class: problem
  - platform: template
    name: "Bypass otwarty"
    lambda: return id(bypass_open);
  - platform: template
    name: "Nagrzewnica wstępna pracuje"
    lambda: return id(heat_on);
  - platform: template
    name: "Filtry do wymiany"
    device_class: problem
    lambda: return id(filter_sec) / 86400.0f >= id(n_filtr_dni).state;
  - platform: status
    name: "Status sterownika"

text_sensor:
  - { platform: template, id: txt_alarmy, name: "Aktywne alarmy", icon: mdi:alert }
  - { platform: template, id: txt_stan, name: "Stan pracy", icon: mdi:fan }
  # 16.11.2026: diagnostyka
  - platform: debug
    reset_reason:
      name: "Przyczyna restartu"
      entity_category: diagnostic
  - platform: wifi_info
    bssid:
      name: "Punkt dostępowy (BSSID)"
      entity_category: diagnostic
  - platform: version
    name: "Wersja ESPHome"
    hide_timestamp: true
    entity_category: diagnostic

# =====================================================================
#  LOGIKA
# =====================================================================
interval:
  # ---------- 1 s: wydajność, odmrażanie, rampa, nagrzewnica ----------
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = sek_od_startu();
          auto ok = [](float v) { return !std::isnan(v); };
          auto clampf = [](float v, float lo, float hi) { return v < lo ? lo : (v > hi ? hi : v); };
          const float b1 = id(n_b1).state, b2 = id(n_b2).state, b3 = id(n_b3).state, b4 = id(n_b4).state;
          static const char *const NAZWY[] = {"Bieg 1", "Bieg 2", "Bieg 3", "Bieg 4", "Nocny", "Urlop", "Wyłączony"};

          // ---------- tryb testowy: ręczne sterowanie DAC ----------
          if (id(test_mode).state) {
            id(heat_on) = false;   // w trybie testowym nagrzewnicą sterujesz ręcznie przełącznikiem K1
            id(out_naw) = id(n_test_naw).state;
            id(out_wyw) = id(n_test_wyw).state;
            id(dac_naw).set_level(id(out_naw) / 100.0f);
            id(dac_wyw).set_level(id(out_wyw) / 100.0f);
            if (id(out_naw) < 20.0f && id(k1_heat).state) id(k1_heat).turn_off();   // bez przepływu nigdy nie grzej
            if (id(txt_stan).state != "TEST") id(txt_stan).publish_state("TEST");
            return;
          }

          // ---------- tryb (lokalna noc 22-6, gdy HA niedostępny > 10 min) ----------
          auto ai = id(tryb).active_index();
          int m = ai.has_value() ? (int) ai.value() : 1;
          if (id(api_server).is_connected()) id(ha_last_seen) = now;
          if (m <= 3 && now - id(ha_last_seen) > 600) {
            auto t = id(sntp_time).now();
            if (t.is_valid() && (t.hour >= 22 || t.hour < 6)) m = 4;
          }
          float dem = 0;
          switch (m) {
            case 0: dem = b1; break;
            case 1: dem = b2; break;
            case 2: dem = b3; break;
            case 3: dem = b4; break;
            case 4: dem = std::min(b2, id(n_noc_max).state); break;
            case 5: dem = id(n_urlop).state; break;
            default: dem = 0; break;
          }
          std::string stan = NAZWY[m];
          float sup = dem, ext = dem > 0 ? dem + id(n_bal).state : 0;
          if (m != 6 && now < id(wietrz_until)) { sup = b4; ext = b4 + id(n_bal).state; stan = "Przewietrzanie"; }
          if (m != 6 && now < id(kominek_until)) {
            sup = dem + id(n_kom_delta).state; ext = dem - id(n_kom_delta).state; stan = "Kominek";
          }

          // ---------- nagrzewnica wstępna 500 W: włącz/wyłącz z histerezą ----------
          // Warunek przepływu: nawiew >= 20 % i (jeśli tacho włączone) > 200 obr/min.
          float sp = id(n_frost_sp).state, tw = id(t_wyr).state, tz = id(t_zew).state;
          bool pre_cfg = id(cfg_preheater).state;
          bool airflow = id(out_naw) >= 20.0f && (!id(cfg_tacho).state || id(rpm_naw).state > 200);
          bool allow = pre_cfg && airflow && ok(tw) && (!ok(tz) || tz < id(n_pre_tmax).state);
          bool h = id(heat_on);
          if (!allow) h = false;
          else if (now - id(heat_changed) >= 120) {        // min. 2 min między przełączeniami
            if (!h && tw < sp) h = true;
            else if (h && tw > sp + 2.5f) h = false;
          }
          if (h != id(heat_on)) { id(heat_on) = h; id(heat_changed) = now; }
          if (h) id(k1_heat).turn_on(); else id(k1_heat).turn_off();

          // ---------- odmrażanie dławieniem nawiewu ----------
          // bez nagrzewnicy: od razu; z nagrzewnicą: gdy po 10 min pracy T_WYR wciąż < nastawa - 1
          bool weak = h && (now - id(heat_changed) > 600) && ok(tw) && tw < sp - 1.0f;
          float ff = 1.0f;
          if (ok(tw)) { if (!pre_cfg || weak) ff = clampf((tw - (sp - 4.0f)) / 4.0f, 0, 1); }
          else if (ok(id(t_cze).state) && id(t_cze).state < -3.0f) ff = 0.5f;
          id(frost_factor) = ff;
          if (ff < 1.0f && dem > 0) {
            sup *= ff;
            if (pre_cfg) sup = std::max(sup, 22.0f);      // przy grzaniu nie schodź poniżej warunku przepływu
            ext = std::max(ext, b1);
            stan += " + odmrażanie";
          }

          // ---------- minimum, rampa 2 %/s, DAC ----------
          auto lim = [&](float v) -> float { return v <= 0.5f ? 0.0f : clampf(std::max(v, id(n_min_run).state), 0, 100); };
          sup = lim(sup); ext = lim(ext);
          auto ramp = [](float cur, float tgt) -> float { return tgt > cur ? std::min(tgt, cur + 2.0f) : std::max(tgt, cur - 2.0f); };
          id(out_naw) = ramp(id(out_naw), sup);
          id(out_wyw) = ramp(id(out_wyw), ext);
          id(dac_naw).set_level(id(out_naw) / 100.0f);
          id(dac_wyw).set_level(id(out_wyw) / 100.0f);
          if (id(txt_stan).state != stan) id(txt_stan).publish_state(stan);

  # ---------- 30 s: bypass ----------
  - interval: 30s
    then:
      - lambda: |-
          auto ok = [](float v) { return !std::isnan(v); };
          float tk = id(n_t_kom).state, tw = id(t_wyc).state, tc = id(t_cze).state;
          // 16.11.2026: temperatura odniesienia = dom (z HA); gdy HA niedostępny lub wartość
          // niewiarygodna – T wyciągu przy centrali (jak dawniej)
          float td = id(t_dom).state;
          if (id(api_server).is_connected() && ok(td) && td > 10.0f && td < 35.0f) tw = td;
          auto bi = id(byp_mode).active_index();
          int bm = bi.has_value() ? (int) bi.value() : 0;
          bool open = id(bypass_open);
          if (bm == 1) open = true;
          else if (bm == 2) open = false;
          else if (ok(tw) && ok(tc)) {
            bool want  = tw > tk + 0.5f && tc < tw - 2.0f && tc > id(n_byp_min).state;
            bool close = tw < tk - 0.5f || tc > tw - 1.0f || tc < id(n_byp_min).state - 1.0f;
            if (!open && want) open = true;
            else if (open && close) open = false;
          } else open = false;
          if (bm == 0 && (id(heat_on) || id(frost_factor) < 1.0f)) open = false;
          id(bypass_open) = open;
          if (open) id(k3_bypass).turn_on(); else id(k3_bypass).turn_off();

  # ---------- 60 s: licznik filtrów ----------
  - interval: 60s
    then:
      - lambda: if (id(out_naw) > 0) id(filter_sec) += 60;

  # ---------- 5 s: alarmy ----------
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = sek_od_startu();
          auto nan = [](float v) { return std::isnan(v); };
          std::string a;
          auto add = [&](const char *s) { if (!a.empty()) a += ", "; a += s; };
          // 16.11.2026: alarm czujnika dopiero, gdy brak odczytu trwa > 30 s (nie miga po restarcie)
          static uint32_t brak_od[5] = {0, 0, 0, 0, 0};
          auto czujnik = [&](int i, float v, const char *nazwa) {
            if (nan(v)) { if (!brak_od[i]) brak_od[i] = now + 1; if (now + 1 - brak_od[i] > 30) add(nazwa); }
            else brak_od[i] = 0;
          };
          czujnik(0, id(t_zew).state, "czujnik T_ZEW");
          czujnik(1, id(t_cze).state, "czujnik T_CZE");
          czujnik(2, id(t_naw).state, "czujnik T_NAW");
          czujnik(3, id(t_wyc).state, "czujnik T_WYC");
          czujnik(4, id(t_wyr).state, "czujnik T_WYR");
          float tw = id(t_wyr).state;
          if (!nan(tw) && tw < -2.0f) { if (!id(frost_since)) id(frost_since) = now; } else id(frost_since) = 0;
          if (id(frost_since) && now - id(frost_since) > 300) add("ryzyko zamarzania wymiennika");
          if (id(cfg_tacho).state && !id(test_mode).state) {
            bool bn = id(out_naw) > 20 && id(rpm_naw).state < 150;
            bool bw = id(out_wyw) > 20 && id(rpm_wyw).state < 150;
            if (bn) { if (!id(fan_naw_bad_since)) id(fan_naw_bad_since) = now; } else id(fan_naw_bad_since) = 0;
            if (bw) { if (!id(fan_wyw_bad_since)) id(fan_wyw_bad_since) = now; } else id(fan_wyw_bad_since) = 0;
            if (id(fan_naw_bad_since) && now - id(fan_naw_bad_since) > 60) add("awaria wentylatora nawiewu");
            if (id(fan_wyw_bad_since) && now - id(fan_wyw_bad_since) > 60) add("awaria wentylatora wywiewu");
          }
          if (id(filter_sec) / 86400.0f >= id(n_filtr_dni).state) add("filtry do wymiany");
          if (a.empty()) a = "brak";
          if (id(txt_alarmy).state != a) id(txt_alarmy).publish_state(a);
          id(alarm_any).publish_state(a != "brak");
          if (id(frost_since) && now - id(frost_since) > 300) id(buzzer).turn_on(); else id(buzzer).turn_off();
